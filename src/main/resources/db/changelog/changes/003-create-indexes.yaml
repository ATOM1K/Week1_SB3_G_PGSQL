databaseChangeLog:
  - changeSet:
      id: 003-create-indexes
      author: developer
      changes:
        - createIndex:
            indexName: idx_users_name
            tableName: users
            unique: false
            columns:
              - column:
                  name: name
                  sortOrder: ASC
        - createIndex:
            indexName: idx_addresses_city
            tableName: addresses
            unique: false
            columns:
              - column:
                  name: city
                  sortOrder: ASC