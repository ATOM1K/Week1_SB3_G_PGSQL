databaseChangeLog:
  - changeSet:
      id: 002-create-address-table
      author: developer
      changes:
        - createTable:
            tableName: addresses
            remarks: "Таблица адресов пользователей"
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_addresses
                  remarks: "Уникальный идентификатор адреса"
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_addresses_user_id
                    references: users(id)
                  remarks: "Ссылка на пользователя (внешний ключ)"
              - column:
                  name: street
                  type: varchar(255)
                  constraints:
                    nullable: true
                  remarks: "Улица и номер дома"
              - column:
                  name: city
                  type: varchar(100)
                  constraints:
                    nullable: false
                  remarks: "Город"
              - column:
                  name: country
                  type: varchar(100)
                  constraints:
                    nullable: false
                  remarks: "Страна"
              - column:
                  name: postal_code
                  type: varchar(20)
                  constraints:
                    nullable: true
                  remarks: "Почтовый индекс"
              - column:
                  name: is_primary
                  type: boolean
                  defaultValue: false
                  constraints:
                    nullable: false
                  remarks: "Флаг основного адреса"